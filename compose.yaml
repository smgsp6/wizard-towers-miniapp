name: qiqu-gomoku
services:
  app:
    build: .
    env_file: private/app.env
    environment:
      TRUST_REVERSE_PROXY: "1"
      GOMOKU_DOMAIN: "${GOMOKU_DOMAIN:?Set the public domain}"
    volumes:
      - room-state:/state
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 8
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    environment:
      GOMOKU_DOMAIN: "${GOMOKU_DOMAIN:?Set the public domain}"
      NO_PROXY: app,localhost,127.0.0.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certificates:/data
      - caddy-config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
volumes:
  room-state:
  certificates:
  caddy-config:
