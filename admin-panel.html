  <details id="management" class="management" hidden>
    <summary>管理员工具</summary>
    <form id="authorize"><label for="friend-id">Telegram 数字 ID</label><div><input id="friend-id" inputmode="numeric" maxlength="16" required><button type="submit">授权好友</button></div></form>
    <label for="opponent">当前对手</label>
    <select id="opponent"><option value="">选择已授权好友</option></select>
    <label for="owner-color">我的执子颜色</label><select id="owner-color"><option value="1">黑方 · 先手</option><option value="2">白方 · 后手</option></select>
    <div class="controls"><button id="toggle-ai" type="button" hidden></button><button id="v-mode" type="button" hidden></button><button id="revoke" type="button" hidden>移除授权</button></div>
  </details>
  <aside id="analysis" class="management" hidden>
    <strong>对手有冲四胜线</strong>
    <p id="analysis-context"></p>
    <ol id="analysis-line"></ol>
    <button id="resign" type="button">认输</button>
  </aside>
    <div id="v-actions" class="controls" hidden><button id="v-start" type="button">选两个落点</button><button id="v-submit" type="button" hidden>确认双落子</button><button id="v-cancel" type="button" hidden>取消</button></div>
    <button id="reset" type="button" hidden>清盘重开</button>
